name: Release

# On a semver tag. Tagging is the deliberate act that says "this commit is a
# release" -- distinct from main, which says "this commit is deployable".
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://unused"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend suite
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          mypy app
          pytest --cov=app --cov-fail-under=65

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend suite
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

  publish:
    name: Publish release images
    # needs: verify -- a tag is not a licence to skip the tests. A broken
    # release is harder to withdraw than a broken deploy, because people pin to
    # version numbers.
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to create the GitHub Release
      packages: write   # to push to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the release notes can diff against the previous tag.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the version and repository path
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          echo "version=$version"          >> "$GITHUB_OUTPUT"
          echo "major=$major"              >> "$GITHUB_OUTPUT"
          echo "minor=$major.$minor"       >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Three semver tags plus the SHA. The moving tags (1, 1.4) are for
          # humans; the SHA and the digest are what anything automated deploys.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-backend:${{ steps.meta.outputs.minor }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-backend:${{ steps.meta.outputs.major }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-backend:${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-frontend:${{ steps.meta.outputs.minor }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-frontend:${{ steps.meta.outputs.major }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-frontend:${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Generate SBOMs
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-backend:${{ steps.meta.outputs.version }}
          artifact-name: sbom-backend-${{ steps.meta.outputs.version }}.spdx.json

      - name: Write the release notes
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## CivicPulse ${GITHUB_REF_NAME}"
            echo ""
            echo "### Images"
            echo ""
            echo "Deploy by digest, not by tag -- a tag can be repointed at different bytes."
            echo ""
            echo '```'
            echo "backend  ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-backend@${{ steps.backend.outputs.digest }}"
            echo "frontend ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}"
            echo '```'
            echo ""
            echo "### Changes"
            echo ""
            if [ -n "$previous" ]; then
              echo "Since \`$previous\`:"
              echo ""
              git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
            else
              echo "First tagged release."
              echo ""
              git log --no-merges --pretty='- %s (%h)' -20
            fi
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          # A tag ending in a suffix (v1.0.0-rc1) is a prerelease.
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          files: |
            sbom-backend-${{ steps.meta.outputs.version }}.spdx.json
