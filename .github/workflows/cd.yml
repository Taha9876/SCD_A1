name: CD

# On pushes to main only. main is protected: the only way code arrives here is
# through a PR that passed ci.yml and got an approval.
on:
  push:
    branches: [main]
  # Manual re-run, for redeploying the same commit after a rollback.
  workflow_dispatch:

permissions:
  contents: read
  # Only the publish job needs this; it is granted per-job below, not here.
  packages: none

concurrency:
  # Never two deploys of main at once: the second would race the first's
  # rollout and you would not know which one won.
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 1. The full suite again, on the MERGED result. The PR tested the branch;
  #    this tests what main actually became, which is not the same commit.
  # ---------------------------------------------------------------------------
  test:
    name: Test merged result
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://unused"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend lint, types and tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          mypy app
          pytest --cov=app --cov-fail-under=65

      - name: Frontend types match the backend OpenAPI schema
        run: python scripts/check_openapi_contract.py

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint, types and tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Submission lint
        run: python scripts/check_submission.py

  # ---------------------------------------------------------------------------
  # 2. Build and publish. needs: test -- without that gate you publish
  #    artifacts from code you already know is broken, and something downstream
  #    will pull them.
  # ---------------------------------------------------------------------------
  build-push:
    name: Build and push to GHCR
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # GITHUB_TOKEN with packages: write -- scoped to this job, expires with
      # the run, revocable. Never an account password, never a long-lived PAT.
      packages: write
      # Keyless Cosign: the job's short-lived OIDC identity token is exchanged
      # for a signing certificate bound to THIS workflow on THIS repository.
      # No signing key exists anywhere to leak, rotate or commit.
      id-token: write
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repository name
        # GHCR rejects uppercase in a path, and GitHub org names often have it.
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Both tags are pushed. Only the SHA is ever DEPLOYED -- `latest` is a
          # convenience for humans pulling by hand, and deploying it is a marked
          # error because the tag moves.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign both images by digest (keyless)
        # Sign the DIGEST, never a tag: a tag can be repointed after signing,
        # a digest cannot. The signature and its certificate go to the
        # registry beside the image and to the public Rekor transparency log.
        env:
          BACKEND: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend@${{ steps.backend.outputs.digest }}
          FRONTEND: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          cosign sign --yes "$BACKEND"
          cosign sign --yes "$FRONTEND"

      - name: Generate SBOMs with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend:${{ github.sha }}
          artifact-name: sbom-backend.spdx.json

      - name: Record the deployed references
        # The digest is the content-addressed identity: a tag can be repointed
        # at different bytes, a digest cannot. This is what makes "what is
        # production running?" a one-word answer.
        run: |
          {
            echo "### Published images"
            echo ""
            echo "| image | tag | digest |"
            echo "|---|---|---|"
            echo "| backend | \`${{ github.sha }}\` | \`${{ steps.backend.outputs.digest }}\` |"
            echo "| frontend | \`${{ github.sha }}\` | \`${{ steps.frontend.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. Deploy to an ephemeral cluster and prove it actually serves traffic.
  # ---------------------------------------------------------------------------
  deploy-k8s:
    name: Deploy to k3d and smoke test
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Create the cluster and install the platform add-ons
        uses: ./.github/actions/k3d-cluster

      - name: Lowercase the repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create the namespace and the real Secret
        # From GitHub Secrets, applied at deploy time. The committed manifest
        # holds placeholders only -- a real key in a committed manifest is a -15
        # deduction, and base64 is encoding, not encryption.
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic civicpulse-secrets \
            --namespace civicpulse \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create the registry pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --namespace civicpulse \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n civicpulse \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to GHCR (to read signatures)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both signatures before deploying anything
        # Refuse to deploy an image this exact workflow did not sign. The
        # identity check is what makes it mean something: a valid signature
        # from someone else's workflow -- or a fork's -- fails here.
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          BACKEND: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend@${{ needs.build-push.outputs.backend-digest }}
          FRONTEND: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-frontend@${{ needs.build-push.outputs.frontend-digest }}
        run: |
          for image in "$BACKEND" "$FRONTEND"; do
            echo "== $image"
            cosign verify "$image" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --output text > verify.out
            head -n 5 verify.out
          done

      - name: Pin the overlay to the verified DIGESTS
        # Deploy by digest, not by tag (bonus). The SHA tag is immutable by
        # convention; the digest is immutable by construction -- it IS the
        # content hash, so the bytes the kubelet pulls are exactly the bytes
        # that were tested, signed and verified above. `kustomize edit` changes
        # the runner's checkout only; nothing is committed.
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            ghcr.io/OWNER/REPO/civicpulse-backend=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend@${{ needs.build-push.outputs.backend-digest }}
          kustomize edit set image \
            ghcr.io/OWNER/REPO/civicpulse-frontend=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-frontend@${{ needs.build-push.outputs.frontend-digest }}
          kustomize build . | grep 'image:'
          # Fail rather than silently fall back to a tag.
          if kustomize build . | grep -E 'image: .*civicpulse-(backend|frontend):'; then
            echo "::error::an application image is still referenced by tag"; exit 1
          fi

      - name: Apply the data layer first
        # Postgres and Redis must be ready before the migration Job, and the
        # migration must finish before the backend starts. Ordering it here
        # rather than relying on CrashLoopBackOff-and-retry.
        run: |
          kustomize build k8s/overlays/prod > /tmp/prod.yaml
          # Configuration first: Postgres reads it through configMapKeyRef and
          # would otherwise sit in CreateContainerConfigError.
          kubectl apply -f /tmp/prod.yaml --selector app.kubernetes.io/component=config
          kubectl apply -f /tmp/prod.yaml --selector app.kubernetes.io/component=database
          kubectl apply -f /tmp/prod.yaml --selector app.kubernetes.io/component=cache
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=240s
          kubectl -n civicpulse rollout status deployment/redis --timeout=180s

      - name: Run migrations
        # One Job, waited on. An initContainer would run this once per replica,
        # concurrently, and two `alembic upgrade head` transactions racing on
        # the version table is how you get a deadlock during a deploy.
        run: |
          kubectl apply -f /tmp/prod.yaml --selector app.kubernetes.io/name=migrate
          kubectl -n civicpulse wait --for=condition=complete job/civicpulse-migrate --timeout=180s \
            || { kubectl -n civicpulse logs job/civicpulse-migrate; exit 1; }
          kubectl -n civicpulse logs job/civicpulse-migrate

      - name: Apply everything else
        run: |
          kubectl apply -f /tmp/prod.yaml
          kubectl -n civicpulse rollout status deployment/backend  --timeout=300s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s

      - name: Seed demo data
        # seed-job.yaml is not in the kustomization (production does not seed),
        # so `kustomize edit set image` never reaches it. Pin its image to the
        # same verified digest here, or the pod pulls the literal placeholder.
        run: |
          sed "s#ghcr.io/OWNER/REPO/civicpulse-backend:PLACEHOLDER#${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend@${{ needs.build-push.outputs.backend-digest }}#" \
            k8s/base/seed-job.yaml | kubectl apply -f -
          kubectl -n civicpulse wait --for=condition=complete job/civicpulse-seed --timeout=180s \
            || { kubectl -n civicpulse logs job/civicpulse-seed; exit 1; }

      - name: Smoke test through the Ingress
        # Through the Ingress, not through a port-forward. A port-forward would
        # skip the Ingress, the Service and the readiness gating -- exactly the
        # parts most likely to be misconfigured.
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Host: civicpulse.local' http://localhost:8081/api/stats > /tmp/stats.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/stats.json
          python -c 'import json; d=json.load(open("/tmp/stats.json")); assert d["total"] >= 30, d; print("seeded rows visible through the ingress:", d["total"])'

          # The page itself, through the same host.
          curl -fsS -H 'Host: civicpulse.local' http://localhost:8081/ | grep -q CivicPulse

          # And a real write, end to end.
          curl -fsS -X POST -H 'Host: civicpulse.local' \
            -H 'Content-Type: application/json' \
            -d '{"text":"Smoke test: transformer sparking over the footpath here.","location":"CI runner, ephemeral cluster"}' \
            http://localhost:8081/api/complaints | python -m json.tool

      - name: Install k6
        uses: grafana/setup-k6-action@v1.2.2

      - name: Zero-downtime rolling update under live load
        # Bonus: every backend AND frontend pod is replaced while k6 offers a
        # constant 20 req/s through the Ingress. load/k6-rolling.js fails the
        # run on a single failed request (http_req_failed rate==0).
        run: |
          BASE_URL=http://localhost:8081 HOST_HEADER=civicpulse.local \
            k6 run --summary-export=rolling-summary.json load/k6-rolling.js > k6-rolling.log 2>&1 &
          k6_pid=$!

          sleep 20   # a baseline under load before anything changes
          kubectl -n civicpulse rollout restart deployment/backend deployment/frontend
          kubectl -n civicpulse rollout status deployment/backend  --timeout=240s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=240s
          echo "rollout finished at $(date -u +%T)"

          # The claim only holds if load covered the WHOLE rollout.
          if ! kill -0 "$k6_pid" 2>/dev/null; then
            echo "::error::k6 finished before the rollout did"; cat k6-rolling.log; exit 1
          fi

          set +e; wait "$k6_pid"; k6_status=$?; set -e
          cat k6-rolling.log
          python3 scripts/rolling_summary.py rolling-summary.json | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n civicpulse get rs -l app.kubernetes.io/part-of=civicpulse
          exit "$k6_status"

      - name: Upload the rolling-update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-downtime-rollout
          path: |
            k6-rolling.log
            rolling-summary.json
          if-no-files-found: ignore

      - name: Verify Postgres survives losing its pod
        # The persistence claim, tested rather than asserted.
        run: |
          before=$(curl -fsS -H 'Host: civicpulse.local' http://localhost:8081/api/stats \
            | python -c 'import sys,json; print(json.load(sys.stdin)["total"])')
          kubectl -n civicpulse delete pod postgres-0 --wait=true
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=240s
          kubectl -n civicpulse wait --for=condition=ready pod -l app.kubernetes.io/name=backend --timeout=180s
          sleep 5
          after=$(curl -fsS -H 'Host: civicpulse.local' http://localhost:8081/api/stats \
            | python -c 'import sys,json; print(json.load(sys.stdin)["total"])')
          echo "rows before=$before after=$after"
          test "$before" = "$after" || { echo "::error::rows lost when the Postgres pod was deleted"; exit 1; }

      - name: Print the HPA
        # Expect <unknown>/60% briefly while metrics-server gathers its first
        # window, then a real percentage. Permanently <unknown> means the
        # resources.requests.cpu block is missing.
        run: |
          kubectl -n civicpulse get hpa backend-hpa -o wide
          kubectl -n civicpulse describe hpa backend-hpa | tail -20

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- backend digest: \`${{ needs.build-push.outputs.backend-digest }}\`"
            echo "- frontend digest: \`${{ needs.build-push.outputs.frontend-digest }}\`"
            echo ""
            echo '```'
            kubectl -n civicpulse get deploy,sts,hpa,pdb 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse get all
          kubectl -n civicpulse describe pods
          kubectl -n civicpulse logs -l app.kubernetes.io/name=backend --tail=100 --all-containers || true
          kubectl -n civicpulse get events --sort-by=.lastTimestamp | tail -40

      - name: Delete the cluster
        if: always()
        run: k3d cluster delete civicpulse

  # ---------------------------------------------------------------------------
  # 4. GitOps (bonus): Argo CD reconciles a second ephemeral cluster from the
  #    repository. No `kubectl apply` of the application here -- the only
  #    thing applied is the Argo CD Application, which names a git path and a
  #    commit. Then drift is introduced by hand and Argo is made to undo it.
  # ---------------------------------------------------------------------------
  gitops:
    name: GitOps sync with Argo CD
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      ARGOCD_VERSION: v3.5.3
    steps:
      - uses: actions/checkout@v4

      - name: Create the cluster and install the platform add-ons
        uses: ./.github/actions/k3d-cluster

      - name: Lowercase the repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install Argo CD
        # --server-side: the ApplicationSet CRD is larger than the 256 KB
        # last-applied annotation a client-side apply would try to write.
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
          kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status deployment/argocd-server --timeout=300s

      - name: Create what git must never hold (out of band)
        # The Secret comes from GitHub Secrets, as in the deploy job. The
        # overlay does not manage it, so Argo neither overwrites nor prunes it.
        run: |
          kubectl create namespace civicpulse
          kubectl create secret generic civicpulse-secrets \
            --namespace civicpulse \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=LLM_API_KEY="${{ secrets.LLM_API_KEY }}"
          kubectl create secret docker-registry ghcr-pull \
            --namespace civicpulse \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
          kubectl patch serviceaccount default -n civicpulse \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Point the Application at this commit and the signed digests
        # The release pins the commit and the digests in the Application
        # itself; see the header of k8s/argocd/application.yaml.
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          BACKEND: ghcr.io/OWNER/REPO/civicpulse-backend=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-backend@${{ needs.build-push.outputs.backend-digest }}
          FRONTEND: ghcr.io/OWNER/REPO/civicpulse-frontend=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/civicpulse-frontend@${{ needs.build-push.outputs.frontend-digest }}
        run: |
          yq -i '
            .spec.source.repoURL = strenv(REPO_URL) |
            .spec.source.targetRevision = strenv(GITHUB_SHA) |
            .spec.source.kustomize.images = [strenv(BACKEND), strenv(FRONTEND)]
          ' k8s/argocd/application.yaml
          yq '.spec.source' k8s/argocd/application.yaml
          kubectl apply -f k8s/argocd/application.yaml

      - name: Wait for Argo CD to report Synced and Healthy
        run: |
          for attempt in $(seq 1 72); do
            sync=$(kubectl -n argocd get application civicpulse -o jsonpath='{.status.sync.status}')
            health=$(kubectl -n argocd get application civicpulse -o jsonpath='{.status.health.status}')
            echo "$(date -u +%T) sync=${sync:-?} health=${health:-?}"
            if [ "$sync" = Synced ] && [ "$health" = Healthy ]; then break; fi
            sleep 10
          done
          test "$sync" = Synced && test "$health" = Healthy
          revision=$(kubectl -n argocd get application civicpulse -o jsonpath='{.status.sync.revision}')
          echo "synced revision: $revision"
          test "$revision" = "$GITHUB_SHA" || { echo "::error::Argo synced $revision, expected $GITHUB_SHA"; exit 1; }
          kubectl -n argocd get application civicpulse \
            -o jsonpath='{range .status.resources[*]}{.kind}{"/"}{.name}{"  "}{.status}{"  "}{.health.status}{"\n"}{end}'

      - name: Smoke test what Argo deployed, through the Ingress
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS -H 'Host: civicpulse.local' http://localhost:8081/api/stats > stats.json 2>/dev/null && break
            sleep 2
          done
          cat stats.json; echo
          curl -fsS -H 'Host: civicpulse.local' http://localhost:8081/ | grep -q CivicPulse
          kubectl -n civicpulse get deploy,sts -o wide

      - name: Self-heal -- manual drift is reverted from git
        # The GitOps property itself: the cluster converges on the repository,
        # not on whoever last ran kubectl.
        run: |
          want=$(kustomize build k8s/overlays/gitops \
            | yq 'select(.kind == "Deployment" and .metadata.name == "frontend") | .spec.replicas')
          echo "frontend replicas in git: $want"

          echo "--- drift 1: scale the frontend by hand to 5"
          kubectl -n civicpulse scale deployment/frontend --replicas=5
          for attempt in $(seq 1 45); do
            now=$(kubectl -n civicpulse get deployment frontend -o jsonpath='{.spec.replicas}')
            echo "$(date -u +%T) spec.replicas=$now"
            [ "$now" = "$want" ] && break
            sleep 2
          done
          test "$now" = "$want"

          echo "--- drift 2: delete the frontend Service"
          kubectl -n civicpulse delete service frontend
          for attempt in $(seq 1 45); do
            kubectl -n civicpulse get service frontend >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl -n civicpulse get service frontend
          curl -fsS -H 'Host: civicpulse.local' http://localhost:8081/ | grep -q CivicPulse
          echo "both drifts reverted by Argo CD"

      - name: GitOps summary
        if: always()
        run: |
          {
            echo "### GitOps (Argo CD ${ARGOCD_VERSION})"
            echo ""
            echo '```'
            kubectl -n argocd get application civicpulse -o wide 2>&1 || true
            echo ""
            kubectl -n argocd get application civicpulse \
              -o jsonpath='{range .status.history[*]}{.revision}{"  deployed "}{.deployedAt}{"\n"}{end}' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n argocd get application civicpulse -o yaml | tail -80 || true
          kubectl -n civicpulse get all || true
          kubectl -n civicpulse get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=60 || true

      - name: Delete the cluster
        if: always()
        run: k3d cluster delete civicpulse
