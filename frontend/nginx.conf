# nginx configuration for the CivicPulse frontend image.
#
# Two jobs: serve the static bundle, and proxy /api to the backend. The proxy is
# the primary answer to the runtime-configuration problem -- with it, the
# browser only ever calls same-origin /api, so the bundle contains no backend
# URL at all and there is no CORS preflight in the normal path.
# See docs/adr/0002-frontend-runtime-config.md.

server {
    # Both address families. Inside the Alpine image `localhost` resolves to
    # ::1 first, and busybox wget does not fall back to IPv4 -- so with only an
    # IPv4 listener the container HEALTHCHECK got "connection refused" and the
    # container sat `unhealthy` while nginx was serving perfectly well.
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    # Reasonable defences for a page that renders citizen-submitted text.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # ---------------------------------------------------------------------
    # Runtime configuration. Written by docker-entrypoint.sh at container
    # start from environment variables. It must never be cached, or a browser
    # would keep yesterday's environment's config after a redeploy.
    # ---------------------------------------------------------------------
    location = /config.js {
        # Written to /tmp by the entrypoint: the web root is read-only in k8s.
        alias /tmp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---------------------------------------------------------------------
    # API proxy. BACKEND_ORIGIN is substituted at container start.
    # Note it is a service name, never localhost: inside a container
    # localhost is the container itself, and the backend is a different one.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass         ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # The backend's rate limiter keys on the first hop of this header, so
        # without it every citizen would share one bucket via the proxy IP.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Generous, because a triage call legitimately takes seconds. Must
        # exceed the backend's 10s LLM timeout or nginx cuts off a request the
        # backend would have answered.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Header the Stats view reads to show cache behaviour. Proxied through
        # explicitly so it survives the hop.
        proxy_pass_header  X-Cache;
        proxy_pass_header  X-Request-ID;
    }

    # Probe passthrough, so `curl http://frontend:8080/ready` reports on the
    # whole path a citizen's request actually takes.
    location = /ready {
        proxy_pass         ${BACKEND_ORIGIN}/ready;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # The frontend's own liveness. Deliberately static: it answers "is nginx
    # serving?", and must not fail because the backend is down.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # Hashed asset filenames mean these are safe to cache for a year; a new
    # build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html itself must not be cached, or a browser keeps
    # loading the old bundle's asset names after a deploy.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
