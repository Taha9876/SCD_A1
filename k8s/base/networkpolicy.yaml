# The Kubernetes equivalent of compose.yaml's `internal: true` network.
#
# Compose gives you segmentation by attaching containers to different bridges.
# Kubernetes gives every pod a route to every other pod by default, so the same
# property has to be asserted explicitly -- otherwise the isolation you
# demonstrated on a laptop quietly disappears on the cluster.
#
# NOTE: NetworkPolicy needs a CNI that enforces it. k3d's default Flannel does
# NOT; kind with Calico does, and so does k3d with --k3s-arg
# '--flannel-backend=none'. Applying these to a cluster that ignores them is
# worse than not writing them, because it looks like protection. If your cluster
# does not enforce them, say so in your notes rather than claiming the control.
#
# Verify enforcement:
#   kubectl run probe --rm -it --image=busybox:1.37 -n civicpulse --restart=Never \
#     --labels=app.kubernetes.io/name=frontend -- \
#     sh -c 'nc -zvw2 postgres-client 5432'
#   # expect: timed out
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: civicpulse
spec:
  # Start from deny-all, then allow the specific flows below. A policy set that
  # starts from allow-all and blocks known-bad is a policy set with holes.
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-ingress
  namespace: civicpulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: ["Ingress"]
  ingress:
    # From the Ingress controller, and from anywhere outside the namespace --
    # this is the public face of the system.
    - ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-ingress
  namespace: civicpulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - port: 8000
          protocol: TCP
    # The Ingress controller reaches /api directly, and Prometheus scrapes
    # /metrics. Both live outside this namespace.
    - ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-backend-only
  namespace: civicpulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # The backend, and the migrate/seed Jobs. Nothing else -- and
        # specifically NOT the frontend, which is the whole point.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: migrate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seed
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-backend-only
  namespace: civicpulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seed
      ports:
        - port: 6379
          protocol: TCP
