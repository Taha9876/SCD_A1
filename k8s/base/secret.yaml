# PLACEHOLDERS ONLY. This file is committed; the real values are not.
#
# base64 is encoding, not encryption: `echo <value> | base64 -d` is the whole
# attack. A real LLM key committed here, even base64-encoded, is a -15 mark
# deduction and a credential you then have to rotate.
#
# Supply the real values out of band, e.g.
#
#   kubectl create secret generic civicpulse-secrets \
#     --namespace civicpulse \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=LLM_API_KEY="$GROQ_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# In CI these come from GitHub Secrets. See .github/workflows/cd.yml.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_NOT_A_REAL_PASSWORD"
  LLM_API_KEY: "REPLACE_ME_NOT_A_REAL_KEY"
