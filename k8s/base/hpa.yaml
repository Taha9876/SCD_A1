# Horizontal Pod Autoscaler on the backend.
#
# Requires metrics-server:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   # on kind/k3d, metrics-server needs --kubelet-insecure-tls:
#   kubectl patch -n kube-system deployment metrics-server --type=json \
#     -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#
# And it requires resources.requests.cpu on the backend pods. The HPA computes
# utilisation as usage / request; with no request there is no denominator and
# this sits at <unknown>/60% indefinitely. See k8s/base/backend.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 60%, not 90%: the headroom is what absorbs load arriving faster than
          # new pods can become ready. Autoscaling is not instant, so the target
          # has to leave room for the lag.
          averageUtilization: 60
  behavior:
    scaleUp:
      # Zero stabilisation window: users are waiting. Act on the newest reading
      # rather than waiting to be sure.
      stabilizationWindowSeconds: 0
      policies:
        # Whichever is larger -- doubling is right when you have 2 pods,
        # +4 is right when you have 8.
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Five minutes of sustained low utilisation before shrinking. Flapping is
      # expensive in both directions: every scale-down throws away a warm pod
      # and every scale-up pays the cold-start again. Slow down, fast up.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min
