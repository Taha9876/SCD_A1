# Non-secret configuration only. Anything here is readable by anyone with `get
# configmap` in this namespace, so the LLM key lives in secret.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
  namespace: civicpulse
  labels:
    # Lets a deploy apply configuration before anything that reads it:
    # `kubectl apply -l app.kubernetes.io/component=config`. Without that
    # ordering the Postgres pod starts first and sits in
    # CreateContainerConfigError, because configMapKeyRef cannot resolve.
    app.kubernetes.io/component: config
data:
  # Service DNS names, never localhost. In a pod, localhost is the pod.
  REDIS_URL: "redis://redis:6379/0"
  LLM_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_MODEL: "qwen/qwen3.8-27b"
  OLLAMA_BASE_URL: "http://ollama:11434"
  TRIAGE_PROVIDER: "rules"
  TRIAGE_TIMEOUT_SECONDS: "10"
  TRIAGE_MAX_RETRIES: "1"
  STATS_CACHE_TTL_SECONDS: "30"
  RATE_LIMIT_REQUESTS: "10"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "kubernetes"
  POSTGRES_DB: "civicpulse"
  POSTGRES_USER: "civicpulse"
