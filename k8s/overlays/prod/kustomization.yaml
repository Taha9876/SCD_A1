apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - ../../base
  - resource-governance.yaml

# IMAGE TAGS ARE SET BY CI, NOT COMMITTED HERE.
#
# cd.yml runs, from this directory:
#   kustomize edit set image \
#     ghcr.io/OWNER/REPO/civicpulse-backend=ghcr.io/${REPO}/civicpulse-backend:${GITHUB_SHA}
#
# The tag is a commit SHA -- an immutable reference. Deploying `latest` is a
# marked error because the tag moves: two pods started an hour apart can run
# different code with nothing in the cluster recording which. "What is
# production running?" must be answerable with `git show <sha>`.
#
# For the bonus, use the digest instead of the SHA tag: a tag is still a
# mutable pointer at the registry, a digest is content-addressed and cannot be
# repointed at different bytes.
images:
  - name: ghcr.io/OWNER/REPO/civicpulse-backend
    newTag: PLACEHOLDER_SET_BY_CI
  - name: ghcr.io/OWNER/REPO/civicpulse-frontend
    newTag: PLACEHOLDER_SET_BY_CI

# Environment-specific configuration, as a patch on the base ConfigMap.
#
# Not a configMapGenerator with `behavior: merge`: a generator can only merge
# into another generator's output, never into a ConfigMap declared as a plain
# resource, so that version failed with "civicpulse-config does not exist;
# cannot merge or replace" and the overlay never rendered at all. A patch
# also avoids the hash suffix a generator appends to the name.
patches:
  - target:
      kind: ConfigMap
      name: civicpulse-config
    patch: |-
      - op: replace
        path: /data/TRIAGE_PROVIDER
        value: llm
      - op: replace
        path: /data/LOG_LEVEL
        value: INFO
      - op: replace
        path: /data/ENVIRONMENT
        value: production
  # Drop the base's placeholder Secret from production. The real one is created
  # out of band (by cd.yml from GitHub Secrets, see below) BEFORE this overlay
  # is applied; if the overlay also carried base/secret.yaml, `kubectl apply`
  # would overwrite the real password with REPLACE_ME_... and the backend would
  # fail to authenticate to a Postgres already initialised with the real one.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: civicpulse-secrets
        namespace: civicpulse

# The committed Secret holds placeholders only. In a real deployment it is
# replaced out of band:
#
#   kubectl create secret generic civicpulse-secrets -n civicpulse \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=LLM_API_KEY="$LLM_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# CI takes both from GitHub Secrets. A real key committed here, even
# base64-encoded, is a -15 deduction: base64 is encoding, not encryption.
