# Prometheus for the observability overlay (compose.observability.yaml).
#
# One target. The backend exposes its own text-format metrics at /metrics
# (backend/app/metrics.py); Prometheus reaches it by service name over the
# internal network. /metrics is not routed by the frontend's nginx, so it is
# never reachable from the internet.

global:
  # 5s, not the 1m default: the dashboard is for watching a load test, and a
  # one-minute scrape would smear a 30-second spike into a single point.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: civicpulse-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: civicpulse-backend
